version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: terrascore-postgres
    environment:
      POSTGRES_USER: terrascore
      POSTGRES_PASSWORD: terrascore_dev_password
      POSTGRES_DB: terrascore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrascore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terrascore-network

  # TimescaleDB (for time-series data)
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: terrascore-timescale
    environment:
      POSTGRES_USER: terrascore
      POSTGRES_PASSWORD: terrascore_dev_password
      POSTGRES_DB: timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - terrascore-network

  # Redis (cache and task queue)
  redis:
    image: redis:7-alpine
    container_name: terrascore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - terrascore-network

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: terrascore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - terrascore-network

  # Backend API (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: terrascore-api
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://terrascore:terrascore_dev_password@postgres:5432/terrascore
      - TIMESCALE_URL=postgresql://terrascore:terrascore_dev_password@timescale:5432/timeseries
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=admin
      - S3_SECRET_ACCESS_KEY=minio_dev_password
      - SECRET_KEY=development-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - terrascore-network

  # Celery Worker (background tasks)
  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: terrascore-worker
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://terrascore:terrascore_dev_password@postgres:5432/terrascore
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=development-secret-key-change-in-production
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml/models
    depends_on:
      - postgres
      - redis
    command: celery -A app.celery_app worker --loglevel=info
    networks:
      - terrascore-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: terrascore-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - terrascore-network

  # Prometheus (metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: terrascore-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - terrascore-network

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: terrascore-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - terrascore-network

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  terrascore-network:
    driver: bridge
